; ===========================================================================
; worker 容器进程编排
;
; 后台任务一共三类, 全部放进同一个容器, 这样 compose 只需要 5 个服务:
;   1. celery-worker     AI 摘要 / 分类 / 每日简报的异步任务(单进程单并发)
;   2. rssant-worker     RSS 抓取执行器(订阅同步的实际干活进程)
;   3. rssant-scheduler  RSS 抓取调度器(决定什么时候同步哪个订阅源)
; ===========================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/app/data/supervisord.pid

[program:celery-worker]
directory=/app
command=/app/.venv/bin/celery -A rssant_ai.celery worker
    --loglevel=info
    --concurrency=1
    --prefetch-multiplier=1
    --max-tasks-per-child=50
    --queue=ai
environment=RSSANT_ROLE="api"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:rssant-worker]
directory=/app
command=/app/runserver.py
environment=RSSANT_ROLE="worker",RSSANT_BIND_ADDRESS="0.0.0.0:6793"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:rssant-scheduler]
directory=/app
command=/app/runserver.py
environment=RSSANT_ROLE="scheduler",RSSANT_BIND_ADDRESS="0.0.0.0:6790"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
