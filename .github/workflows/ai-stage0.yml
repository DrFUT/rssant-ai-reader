# ===========================================================================
# RSSant AI 阶段 0 回归测试
#
# 目标(只做这一件事):
#   把 fix/ai-stage0 上"三处修复"的回归测试放到 GitHub Actions 上跑,
#   并且必须跑在真实 PostgreSQL 上, 这样并发抢占的原子性才有意义。
#
# 关键取舍 —— 为什么不用 setup-python + ubuntu-latest:
#   本项目的依赖是 Python 3.8 时代的老包(cchardet / django-allauth 0.44 /
#   aiohttp 3.7.4 ...), 其中一部分没有 cp38 轮子, 需要在本地编译,
#   而老包的 setup.py 又和新版 setuptools 不兼容(convert_path 已被移除)。
#   Dockerfile 的构建阶段已经把这些坑都填好了(pip/setuptools/wheel 锁旧版、
#   PIP_CONSTRAINT=cython<3、--no-build-isolation 兜底链)。
#   所以这里直接复用同一个基础镜像 python:3.8.12-bullseye, 按 Dockerfile 的
#   顺序装依赖 —— "能部署成功" 和 "能跑测试" 用同一套解法, 只维护一份。
#
# 不做什么:
#   * 不连线上服务器, 不读线上数据库, 不读任何 Secret。
#   * 不因为"测试跑不过"去放宽断言 / 跳过用例 / 把数据库换成 SQLite。
#     测试库是 postgres:13 service 里的 test_rssant, 与线上无任何关系。
# ===========================================================================
name: ai-stage0

on:
  push:
    branches:
      - fix/ai-stage0
  workflow_dispatch:

# 同一分支有新提交时取消上一轮, 避免并发抢占测试排队互相干扰
concurrency:
  group: ai-stage0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-stage0-tests:
    name: rssant_ai 阶段 0 (py3.8 + pg13)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    # 与 Dockerfile 构建阶段完全相同的镜像(生产依赖就是在这里装的)
    container: python:3.8.12-bullseye

    services:
      postgres:
        # 与 docker-compose.yml 的 image: postgres:13 保持一致
        image: postgres:13
        env:
          POSTGRES_DB: rssant
          POSTGRES_USER: rssant
          POSTGRES_PASSWORD: rssant
        options: >-
          --health-cmd "pg_isready -U rssant -d rssant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: rssant.settings
      RSSANT_DEBUG: "0"
      # 作业在容器里跑, service 通过容器名 postgres 访问。
      # 这里的 rssant 库只是 postgres:13 服务刚初始化出来的空库,
      # pytest-django 会在它上面另建 test_rssant 作为测试库。
      RSSANT_PG_HOST: postgres
      RSSANT_PG_PORT: "5432"
      RSSANT_PG_DB: rssant
      RSSANT_PG_USER: rssant
      RSSANT_PG_PASSWORD: rssant
      # CI 专用占位值, 不是任何真实密钥, 也不参与鉴权
      RSSANT_SECRET_KEY: ci-dummy-secret-key-for-tests-only
      # 队列降级为内存传输: 万一某个用例意外触发 .delay(), 只写内存不外连,
      # 既不会去连 redis, 也不会把作业卡到超时
      RSSANT_CELERY_BROKER_URL: memory://
      RSSANT_CELERY_RESULT_BACKEND: cache+memory://
      # 显式关闭 AI: 没有 api_key 时 is_enabled() 本来就是 False,
      # 这里再加一道闸, 保证整轮 CI 不会产生任何真实模型请求(也更省钱)
      RSSANT_AI_ENABLE: "0"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 容器作业以 root 运行, 不加这一行 git 可能报 dubious ownership
      - name: 容器内 git 权限兜底
        run: git config --global --add safe.directory '*'

      # ---------- 依赖安装: 严格照抄 Dockerfile 的顺序 ----------
      - name: 锁定 pip / setuptools / wheel(老包构建依赖它们)
        run: pip install --no-cache-dir -r requirements-pip.txt

      - name: 预装源码构建工具(cython 2.x)
        run: |
          echo "PIP_CONSTRAINT=${GITHUB_WORKSPACE}/constraint.txt" >> "$GITHUB_ENV"
          pip install --no-cache-dir "cython<3"

      - name: 安装项目依赖
        run: |
          # 第一次关掉构建隔离(覆盖需要老 setuptools 的包, 这是主要矛盾);
          # 万一失败退回默认模式, 此时已装好的包会被跳过, 只补装剩下的那个。
          pip install --no-cache-dir --no-build-isolation -r requirements.txt \
            || pip install --no-cache-dir -r requirements.txt
          # redis-py 跳过依赖声明, 原因见 Dockerfile 注释
          # (redis>=4.5 要 async-timeout>=4.0.2, 与 aiohttp 3.7.4 冲突)
          pip install --no-cache-dir --no-deps redis==4.6.0

      - name: 安装测试依赖
        run: |
          # 版本与 requirements-dev.txt 完全一致, 只取跑测试真正需要的那几个;
          # 其余(locust / flask / pre-commit / pip-tools)与本次验证无关。
          pip install --no-cache-dir pytest==5.4.1 pytest-django==3.10.0

      - name: 版本确认
        run: |
          python -c "import sys, django, psycopg2; print('python     =', sys.version.replace(chr(10), ' ')); print('django     =', django.get_version()); print('psycopg2   =', psycopg2.__version__)"

      # ---------- 测试库: 必须是 PostgreSQL, 且是隔离的 ----------
      - name: 校验测试库是隔离的 PostgreSQL 13
        run: |
          python - <<'PY'
          import os
          import psycopg2

          dsn = dict(
              host=os.environ['RSSANT_PG_HOST'],
              port=int(os.environ['RSSANT_PG_PORT']),
              dbname=os.environ['RSSANT_PG_DB'],
              user=os.environ['RSSANT_PG_USER'],
              password=os.environ['RSSANT_PG_PASSWORD'],
          )
          conn = psycopg2.connect(**dsn)
          conn.autocommit = True
          cur = conn.cursor()

          cur.execute('select version()')
          version = cur.fetchone()[0]
          print('server  =', version)
          assert 'PostgreSQL 13' in version, '数据库版本不是 13: %s' % version

          # 这个库是 postgres:13 service 刚初始化的空库, 里面不该有业务表
          cur.execute(
              "select count(*) from information_schema.tables "
              "where table_schema = 'public'"
          )
          tables = cur.fetchone()[0]
          print('public tables =', tables)
          assert tables == 0, '测试库不是空库, 可能有残留数据'

          # pytest-django 需要 CREATEDB 权限才能建 test_rssant
          cur.execute('create database rssant_ci_probe')
          cur.execute('drop database rssant_ci_probe')
          print('CREATEDB ok -> pytest-django 可以创建 test_rssant')
          cur.close()
          conn.close()
          PY

      - name: 校验 Django 实际连的是 PostgreSQL(不是 SQLite)
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection

          engine = settings.DATABASES['default']['ENGINE']
          print('ENGINE =', engine)
          print('vendor =', connection.vendor)
          assert connection.vendor == 'postgresql', \
              'Django 实际使用的不是 PostgreSQL: %s' % engine

          # 真正建一次连接, 确认网络与口令都通(而不只是读配置)
          connection.ensure_connection()
          with connection.cursor() as cur:
              cur.execute('select current_database(), version()')
              dbname, version = cur.fetchone()
          print('connected db =', dbname)
          print('server       =', version)
          PY

      # ---------- 测试 ----------
      # 说明: 各步统一用 -o 'addopts=' 覆盖 pytest.ini 里的 addopts
      # (--cov / --doctest-modules / -W all)。这几项只是本地开发的便利,
      # 与断言无关; 覆盖掉可以少装 pytest-cov + coverage==4.5.4(需要编译)。
      # pytest.ini 里的 DJANGO_SETTINGS_MODULE 和 markers 仍然生效。
      - name: PostgreSQL 并发抢占(必测, 单独成步)
        run: |
          pytest rssant_ai/tests/test_claim.py::ClaimTestCase::test_concurrent_dispatch_calls_model_once \
            --create-db -o 'addopts=' -v

      - name: rssant_ai 阶段 0 全部新增测试
        run: |
          pytest rssant_ai/tests -o 'addopts=' -v

      - name: 现有回归测试(不依赖网络与存储后端)
        run: |
          pytest \
            rssant_api/tests/reverse_url_tests.py \
            rssant_api/tests/duplicate_feed_detector_tests.py \
            rssant/tests/email_template_tests.py \
            -o 'addopts=' -v
